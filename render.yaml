services:
  - type: web
    name: task-management-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: task-management-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: task-management-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
  - type: keyvalue
    name: task-management-cache
    plan: free
    ipAllowList: []
databases:
  - name: task-management-db
    plan: free
    databaseName: taskapi
    user: taskapi
